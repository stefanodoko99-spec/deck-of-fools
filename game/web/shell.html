/* The start screen: a title card in three colour blocks, Arlecchino on wine, the title
   on harlequin green, Zanni on brick. While the game downloads, a hand of five cards
   turns face up (four with the download, the Ace when the game is ready); then one
   button starts or continues, and the two halves of the card slide apart like a
   curtain onto the game, which is already running underneath. */
:root {
	--wine: #4f1230;
	--brick: #8a2a17;
	--green: #0f6e4f;
	--green-deep: #084a3b;
	--cream: #fbf3e4;
	--ink: #1d1230;
	--heart: #ef2d56;
	--gold: #f0b84a;
	--ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
	--art: 27%;
}
html, body { margin: 0; padding: 0; border: 0; position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--ink); color: var(--cream); }
/* Edge to edge on iPhone: the canvas runs under the notch, the Dynamic Island and the
   home indicator (viewport-fit=cover); the game keeps its controls inside the safe
   area itself (UiTheme.safe_area). No bounce, zoom, text selection or long-press
   callout, so holding a card to read it doesn't pop up iOS menus. */
body, #canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; margin: 0; border: 0; touch-action: none; }
#canvas:focus { outline: none; }
.dof-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

#status { position: fixed; inset: 0; z-index: 5; display: flex; overflow: hidden; isolation: isolate; font-family: var(--ui); -webkit-font-smoothing: antialiased; cursor: default; }
/* The two halves: each is an illustration and half of the green field, so the card
   can split down its middle. */
.dof-half { flex: 1 1 50%; display: flex; min-width: 0; will-change: transform; transition: transform .74s cubic-bezier(.7, 0, .24, 1); }
.dof-half.right { flex-direction: row-reverse; }
.dof-art { position: relative; flex: 0 0 calc(var(--art) * 2); overflow: hidden; background: var(--ink); }
.dof-art::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 54px rgba(15, 3, 28, .28); }
.dof-art.arl::after { background: linear-gradient(90deg, transparent 64%, rgba(29, 18, 48, .7)); }
.dof-art.zan::after { background: linear-gradient(-90deg, transparent 64%, rgba(29, 18, 48, .7)); }
.dof-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.04) contrast(1.03); transform: scale(1.015); }
.dof-art.arl { background: var(--wine); }
.dof-art.arl img { object-position: 60% 30%; }
.dof-art.zan { background: var(--brick); }
.dof-art.zan img { object-position: 64% 30%; }
.dof-green { flex: 1 1 auto; background: var(--ink); }

.dof-centre { position: absolute; top: 0; bottom: 0; left: var(--art); right: var(--art); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) clamp(20px, 3.4vw, 52px) max(36px, env(safe-area-inset-bottom)); box-sizing: border-box; overflow: hidden; text-align: center; background-color: var(--ink); background-image: linear-gradient(45deg, rgba(240,184,74,.035) 25%, transparent 25%, transparent 75%, rgba(240,184,74,.035) 75%), linear-gradient(45deg, rgba(240,184,74,.035) 25%, transparent 25%, transparent 75%, rgba(240,184,74,.035) 75%), radial-gradient(ellipse at 50% 48%, rgba(15,110,79,.68) 0%, rgba(8,74,59,.35) 42%, rgba(29,18,48,0) 74%); background-position: 0 0, 24px 24px, center; background-size: 48px 48px, 48px 48px, 100% 100%; transition: opacity .28s ease, transform .5s ease; }
.dof-centre::before { content: ""; position: absolute; inset: clamp(10px, 1.5vw, 20px); border: 1px solid rgba(240,184,74,.34); border-radius: 18px; box-shadow: inset 0 0 34px rgba(240,184,74,.06), 0 12px 40px rgba(4,0,10,.28); pointer-events: none; }
.dof-centre::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 10%; height: 36%; border-radius: 50%; background: rgba(15,110,79,.18); filter: blur(42px); pointer-events: none; }
.dof-centre > * { position: relative; z-index: 1; }
.dof-title { display: block; flex: none; width: min(84%, 680px); height: clamp(48px, 10.5vh, 82px); color: var(--cream); overflow: visible; filter: drop-shadow(0 5px 12px rgba(4,0,10,.48)); }
.dof-tagline { flex: none; margin: clamp(20px, 2.8vh, 28px) 0 0; font-weight: 650; font-size: clamp(11px, 1.15vh + .36vw, 16px); line-height: 1.3; letter-spacing: .025em; color: rgba(251,243,228,.76); }

/* The hand: five cards in a shallow fan. */
.dof-hand { --cw: clamp(42px, min(13vh, 7vw), 92px); display: flex; justify-content: center; align-items: center; height: calc(var(--cw) * 1.64); margin: clamp(8px, 2.8vh, 25px) 0 clamp(5px, 1.4vh, 12px); perspective: 1000px; transition: transform .48s cubic-bezier(.16,1,.3,1), filter .48s cubic-bezier(.16,1,.3,1); }
.dof-slot { position: relative; width: var(--cw); height: calc(var(--cw) * 1.4); margin: 0 calc(var(--cw) * -.055); transform-origin: 50% 115%; }
.dof-slot:nth-child(1) { transform: translateY(13%) rotate(-13deg); }
.dof-slot:nth-child(2) { transform: translateY(4%) rotate(-6deg); }
.dof-slot:nth-child(4) { transform: translateY(4%) rotate(6deg); }
.dof-slot:nth-child(5) { transform: translateY(13%) rotate(13deg); }
.dof-card { width: 100%; height: 100%; opacity: 0; transform: translateY(34%) scale(.9); transition: transform .54s cubic-bezier(.16,1,.3,1), opacity .3s ease; transition-delay: calc(var(--i) * 70ms); }
.dealt .dof-card { opacity: 1; transform: none; }
.dof-flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .56s cubic-bezier(.3, .7, .2, 1); }
.up .dof-flip { transform: rotateY(180deg); }
.dof-face { position: absolute; inset: 0; border-radius: calc(var(--cw) * .12); overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 calc(var(--cw) * .11) calc(var(--cw) * .28) rgba(4,0,10,.48), 0 2px 4px rgba(4,0,10,.36); }
.dof-face > svg { display: block; width: 100%; height: 100%; }
.dof-front { transform: rotateY(180deg); background: #fffaf2; color: var(--heart); }
.dof-front .rank { position: absolute; left: 10%; top: 8%; width: 46%; height: 27%; }
.dof-front .pip { position: absolute; left: 11%; top: 40%; width: 20%; height: auto; aspect-ratio: 100 / 92; }
.dof-front .big { position: absolute; right: 9%; bottom: 8%; width: 50%; height: auto; aspect-ratio: 100 / 92; }

.dof-status { min-height: 1.4em; font-weight: 750; font-size: clamp(12px, 1.25vh + .36vw, 16px); line-height: 1.4; letter-spacing: .015em; color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(4,0,10,.5); }
.dof-go { display: none; flex-direction: column; align-items: center; margin-top: clamp(7px, 1.6vh, 14px); }
.ready .dof-hand { transform: translateY(-2px) scale(1.035); filter: drop-shadow(0 8px 18px rgba(4,0,10,.2)); }
.ready .dof-go { display: flex; animation: dof-rise .5s cubic-bezier(.16,1,.3,1) both; }
.dof-play { appearance: none; -webkit-appearance: none; border: 0; border-radius: 14px; min-width: clamp(210px, 24vw, 280px); min-height: clamp(48px, 8vh, 60px); padding: 7px clamp(30px, 4vw, 48px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 850 clamp(17px, 1.75vh + .5vw, 22px)/1.12 var(--ui); letter-spacing: -.02em; color: var(--ink); background: var(--cream); cursor: pointer; box-shadow: 0 10px 28px rgba(4,0,10,.44); transition: transform .16s cubic-bezier(.16,1,.3,1), box-shadow .16s ease, background-color .16s ease; }
.dof-play small { font-size: .72em; font-weight: 600; color: rgba(29, 18, 48, .66); }
.dof-play:hover { background: #fffaf0; transform: translateY(-2px); box-shadow: 0 14px 32px rgba(4,0,10,.5); }
.dof-play:active { transform: translateY(1px) scale(.985); box-shadow: 0 6px 17px rgba(4,0,10,.42); }
.dof-play:focus-visible, .dof-alt:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.dof-alt { appearance: none; -webkit-appearance: none; border: 0; background: none; margin-top: 4px; padding: 10px 16px; font: 600 clamp(13px, 1.4vh + .3vw, 15px)/1 var(--ui); color: var(--cream); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(251, 243, 228, .5); }
.dof-alt[hidden] { display: none; }
.dof-tip { position: absolute; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); margin: 0; font-weight: 550; font-size: clamp(10px, 1.05vh + .2vw, 13px); line-height: 1.35; color: rgba(251,243,228,.58); transition: opacity .4s ease; }
.ready .dof-tip, .failed .dof-tip { opacity: 0; }
.dof-notice { display: none; max-width: 440px; margin: 0; font-weight: 600; font-size: 15px; line-height: 1.45; color: var(--cream); }
.failed .dof-notice { display: block; }
.failed .dof-hand, .failed .dof-status { display: none; }
.dof-retry { margin-top: 14px; }

/* The curtain: the halves slide out to the sides and the title steps back. */
#status.parting { pointer-events: none; }
#status.parting .dof-half.left { transform: translateX(-101%); }
#status.parting .dof-half.right { transform: translateX(101%); }
#status.parting .dof-centre { opacity: 0; transform: scale(.97); }
#status.fading { opacity: 0; transition: opacity .22s ease; pointer-events: none; }
@keyframes dof-rise { from { opacity: 0; transform: translateY(14px) scale(.97); filter: blur(5px); } to { opacity: 1; transform: none; filter: blur(0); } }

/* Upright windows (an iPad in portrait, a narrow desktop window): the illustrations
   sit side by side on top, the title below. Upright phones get the turn hint. */
@media (max-aspect-ratio: 11/10) {
	.dof-half { flex-direction: column; }
	.dof-half.right { flex-direction: column; }
	.dof-art { flex: 0 0 46%; }
	.dof-centre { left: 0; right: 0; top: 46%; padding: 16px 20px max(26px, env(safe-area-inset-bottom)); }
	.dof-centre::before { inset: 8px; }
	.dof-title { width: min(78%, 620px); height: clamp(34px, 8vh, 66px); }
	.dof-tagline { margin-top: 12px; }
	.dof-hand { --cw: clamp(38px, min(9.5vh, 10vw), 78px); margin: 6px 0 3px; }
}

@media (max-height: 500px) and (orientation: landscape) {
	.dof-centre { padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(15px, env(safe-area-inset-bottom)); }
	.dof-centre::before { inset: 7px 10px; border-radius: 14px; }
	.dof-title { height: clamp(34px, 10.5vh, 50px); width: min(74%, 560px); }
	.dof-tagline { display: none; }
	.dof-hand { --cw: clamp(36px, min(14vh, 7vw), 62px); margin: 10px 0 1px; }
	.dof-status { font-size: clamp(11px, 3.2vh, 14px); }
	.dof-go { margin-top: 4px; }
	.dof-play { min-height: 42px; min-width: 200px; font-size: 17px; }
	.dof-tip { bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10px; }
}

/* Phones held upright: the game is landscape only. */
.dof-layer { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; font: 500 16px/1.45 var(--ui); color: var(--cream); -webkit-font-smoothing: antialiased; }
#rotate-hint { background: var(--green); flex-direction: column; gap: 18px; text-align: center; padding: 24px; font-weight: 650; font-size: 19px; }
#rotate-hint .phone { width: 46px; height: 76px; border: 4px solid var(--cream); border-radius: 11px; animation: dof-turn 2.4s ease-in-out infinite; }
@keyframes dof-turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 600px) { #rotate-hint { display: flex; } }
/* Install sheet: how to add the game as an app where the browser has no prompt. */
#install-sheet { background: rgba(5, 0, 12, 0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#install-sheet.open { display: flex; }
#install-sheet .card { position: relative; width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 22px 22px 18px; border-radius: 22px; background: rgba(26, 14, 49, 0.97); border: 1px solid rgba(255, 255, 255, 0.13); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); animation: dof-rise .26s cubic-bezier(.2, .8, .2, 1); }
#install-sheet .top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
#install-sheet .top img { width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); }
#install-sheet h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; color: #f0b84a; }
#install-sheet .sub { margin: 2px 0 0; font-size: 14px; color: #cbbfe0; }
#install-sheet ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
#install-sheet li { counter-increment: step; display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 6px 0; border-radius: 14px; background: rgba(255, 255, 255, 0.06); }
#install-sheet li::before { content: counter(step); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #1d1230; background: #f0b84a; }

#install-sheet .done { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 999px; font: inherit; font-weight: 700; color: #1d1230; background: #fbf3e4; cursor: pointer; }

	#install-sheet .glyph { width: 22px; height: 22px; }

	#install-sheet .close { top: 10px; right: 10px; }

		<script>
/* The start screen's controller. The engine code below drives it (dofStart.progress,
   ready, fail). The game can ask window.dofStartScreen() where it is ("loading",
   "ready", "closed", "error"), read window.dofStartChoice ("play" or "continue", empty
   until the player chooses) or listen for the "dofstart" event on window, which carries
   the same choice in event.detail.choice. The game saves what "Continue" offers in
   localStorage "dof-status" (game/ui/web_status.gd). */
const dofStart = (function () {
	const root = document.getElementById('status');
	const hand = root.querySelector('.dof-hand');
	const slots = Array.from(hand.querySelectorAll('.dof-slot'));
	const status = root.querySelector('.dof-status');
	const notice = root.querySelector('.dof-notice');
	const play = root.querySelector('.dof-play');
	const alt = root.querySelector('.dof-alt');
	const tip = root.querySelector('.dof-tip');
	const still = window.matchMedia('(prefers-reduced-motion: reduce)');
	let phase = 'loading';
	let faceUp = 0;
	let wanted = 0;
	let turning = false;
	window.dofStartScreen = function () { return phase; };
	window.dofStartChoice = '';

	let saved = null;
	try {
		saved = JSON.parse(localStorage.getItem('dof-status') || 'null');
	} catch (e) {
		saved = null;
	}
	const resume = saved && typeof saved.continue === 'string' && saved.continue !== '' ? saved.continue : '';

	const tips = [
		'Hold any card to read what it does.',
		'Flushes and straights score far more than pairs.',
		'Jesters work left to right: drag them to change the order.',
		'Skip a Matinee or Evening show to take its Favor instead.',
		'Unused hands pay extra ducats when you win a show.',
		'The daily run deals the same cards to everyone.',
	];
	let tipIndex = Math.floor(Math.random() * tips.length);
	tip.textContent = tips[tipIndex];
	const tipTimer = setInterval(function () {
		if (phase !== 'loading') {
			clearInterval(tipTimer);
			return;
		}
		tipIndex = (tipIndex + 1) % tips.length;
		tip.style.opacity = '0';
		setTimeout(function () { tip.textContent = tips[tipIndex]; tip.style.opacity = ''; }, still.matches ? 0 : 400);
	}, 5500);

	// Deal the hand face down as soon as the page is up.
	requestAnimationFrame(function () { requestAnimationFrame(function () { hand.classList.add('dealt'); }); });

	// Cards turn over one at a time, a beat apart, even when the download is quick.
	function turn(count) {
		wanted = Math.max(wanted, Math.min(5, count));
		if (turning || faceUp >= wanted) return;
		turning = true;
		slots[faceUp].classList.add('up');
		faceUp += 1;
		setTimeout(function () { turning = false; turn(0); }, still.matches ? 0 : 140);
	}

	function progress(current, total) {
		if (phase !== 'loading' || !(current > 0 && total > 0)) return;
		const share = Math.min(1, current / total);
		hand.setAttribute('aria-valuenow', String(Math.floor(share * 100)));
		// Four cards follow the download; the Ace waits for the game to start.
		turn(Math.min(4, Math.floor(share * 5)));
		status.textContent = share >= 1 ? 'Starting the show' : 'Loading ' + Math.floor(share * 100) + '%';
	}

	function ready() {
		if (phase !== 'loading') return;
		phase = 'ready';
		hand.setAttribute('aria-valuenow', '100');
		turn(5);
		if (resume) {
			play.textContent = 'Continue the tour';
			const where = document.createElement('small');
			where.textContent = resume;
			play.appendChild(where);
			alt.hidden = false;
		}
		const show = function () {
			if (faceUp < 5 || turning) {
				setTimeout(show, 60);
				return;
			}
			setTimeout(function () {
				status.textContent = 'Royal flush';
				root.classList.add('ready');
				play.focus({ preventScroll: true });
				// The gallery (tests/preview.gd, ?screen=...) starts straight away.
				if (/[?&]screen=/.test(location.search)) choose('play');
			}, still.matches ? 0 : 280);
		};
		show();
	}

	function choose(choice) {
		if (phase !== 'ready') return;
		if (window.dofKeepData) window.dofKeepData();
		phase = 'closed';
		window.dofStartChoice = choice;
		root.setAttribute('aria-hidden', 'true');
		try {
			window.dispatchEvent(new CustomEvent('dofstart', { detail: { choice: choice } }));
		} catch (e) {
			// No CustomEvent: the game can still read window.dofStartChoice.
		}
		const canvas = document.getElementById('canvas');
		const finish = function () {
			root.remove();
			if (canvas) canvas.focus();
		};
		if (still.matches) {
			root.classList.add('fading');
			setTimeout(finish, 240);
			return;
		}
		// A frame for the game to switch screens under the curtain, then it parts.
		setTimeout(function () {
			root.classList.add('parting');
			setTimeout(finish, 800);
		}, 90);
	}

	play.addEventListener('click', function (e) {
		e.stopPropagation();
		choose(resume ? 'continue' : 'play');
	});
	alt.addEventListener('click', function (e) {
		e.stopPropagation();
		choose('play');
	});
	// Once the game is ready, a tap anywhere on the card does what the big button does.
	root.addEventListener('click', function () {
		if (phase === 'ready') choose(resume ? 'continue' : 'play');
	});

	// A failure stays on screen with its reason. A download or start-up failure gets a
	// "Try again" (a reload); a missing browser feature doesn't, as a reload can't help.
	function fail(text, canRetry) {
		phase = 'error';
		clearInterval(tipTimer);
		root.classList.remove('ready');
		root.classList.add('failed');
		notice.textContent = text;
		if (canRetry) {
			const again = document.createElement('button');
			again.type = 'button';
			again.className = 'dof-play dof-retry';
			again.textContent = 'Try again';
			again.addEventListener('click', function (e) {
				e.stopPropagation();
				location.reload();
			});
			notice.after(again);
		}
	}

	return { progress: progress, ready: ready, fail: fail };
}());

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
				dofStart.fail('This browser can\'t run Deck of Fools. It needs ' + missing.map((m) => String(m).split(' - ')[0]).join(', ') + '. The latest Safari, Chrome, Edge or Firefox will play it.', false);
			});
		} else {
			dofStart.fail('This browser can\'t run Deck of Fools. It needs ' + missing.map((m) => String(m).split(' - ')[0]).join(', ') + '. The latest Safari, Chrome, Edge or Firefox will play it.', false);
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				dofStart.progress(current, total);
			},
		}).then(() => {
			dofStart.ready();
		}, (err) => {
			console.error(err);
			dofStart.fail('The game didn\'t finish loading. Check your connection, then try again.', true);
		});
	}
}());
		</script>
