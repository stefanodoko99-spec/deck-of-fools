html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Deck of Fools\">\n<meta name=\"theme-color\" content=\"#1e0b3d\">\n<meta name=\"description\" content=\"A poker-hand roguelike about a travelling commedia dell'arte troupe.\">\n<style>\nbody { background-color: #1e0b3d; }\n#rotate-hint { display: none; position: fixed; inset: 0; z-index: 10; background: radial-gradient(circle at 50% 40%, #8e1230, #1e0b3d 75%); color: #fbf3e4; font: 600 19px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }\n#rotate-hint .phone { width: 46px; height: 76px; border: 4px solid #e2aa3e; border-radius: 10px; animation: turn 2.4s ease-in-out infinite; }\n@keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }\n@media (prefers-reduced-motion: reduce) { #rotate-hint .phone { animation: none; transform: rotate(-90deg); } }\n@media (orientation: portrait) and (max-width: 600px) { #rotate-hint { display: flex; } }\n</style>\n<script>\ndocument.addEventListener('DOMContentLoaded', function () {\n  var hint = document.createElement('div');\n  hint.id = 'rotate-hint';\n  hint.setAttribute('role', 'alert');\n  hint.innerHTML = '<div class=\"phone\" aria-hidden=\"true\"></div><div>Turn your phone sideways to play</div>';\n  document.body.appendChild(hint);\n});\n</script>"
